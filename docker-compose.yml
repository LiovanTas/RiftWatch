services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: riftwatch
      # Set POSTGRES_PASSWORD (in the shell or a .env next to this file) on any server; the
      # default is for local development. It's only read when the database is first created.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riftwatch}
      POSTGRES_DB: riftwatch
    ports:
      # Only this machine: published on every interface, the database (and its password)
      # would be open to the network, and Docker's published ports bypass host firewalls.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riftwatch"]
      interval: 2s
      retries: 15
    # Back up on its own after a crash, and whenever Docker starts (a reboot, or Docker
    # Desktop restarting its engine). Only `docker compose stop` keeps it down.
    restart: unless-stopped

  # The website. `docker compose up -d db` (local development) starts only the database.
  web:
    build: .
    env_file: .env
    environment:
      RIFTWATCH_DATABASE_URL: postgresql://riftwatch:${POSTGRES_PASSWORD:-riftwatch}@db:5432/riftwatch
      # Set to your reverse proxy's address so visitor limits see real client addresses.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - ./out/ml/models:/app/models:ro
    ports:
      - "127.0.0.1:8000:8000"     # only this machine; the public reaches it through caddy
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # HTTPS for a public server with a domain pointed at it (certificates are automatic):
  #   SITE_DOMAIN=riftwatch.example.com docker compose --profile https up -d --build
  caddy:
    image: caddy:2
    profiles: ["https"]
    command: caddy reverse-proxy --from ${SITE_DOMAIN:-localhost} --to web:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
