services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: riftwatch
      POSTGRES_PASSWORD: riftwatch
      POSTGRES_DB: riftwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riftwatch"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
