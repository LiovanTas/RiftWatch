[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riftwatch"
version = "0.1.0"
description = "League of Legends coaching: per-minute timeline metrics scored against rank-matched baselines, explained by an LLM that only sees computed evidence"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "httpx>=0.27",
    "orjson>=3.10",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.140", "uvicorn>=0.30", "psycopg_pool>=3.2"]
ml = ["pandas>=2.2", "pyarrow>=15", "scikit-learn>=1.5", "joblib>=1.4"]
cv = ["opencv-python-headless>=4.10", "numpy>=1.26"]
dev = ["pytest>=8.0", "riftwatch[web,ml,cv]"]

[project.scripts]
riftwatch = "riftwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"riftwatch.db" = ["migrations/*.sql"]
"riftwatch.vision" = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
